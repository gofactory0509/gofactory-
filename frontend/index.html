<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 면접관과 함께하는 실전 면접 연습 서비스">
    <title>Go면접 면접 연습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-to-b from-gray-50 to-white min-h-screen text-gray-900">
    <script>tailwind.config = { darkMode: 'media' }</script>

    <!-- Header Banner -->
<header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6 rounded-xl mx-4 mt-4 shadow-lg flex items-center gap-4">
    <img src="/assets/logo.png" alt="Go터뷰 로고" class="w-14 h-14 rounded-lg bg-white/20 p-1">
    <div>
        <h1 class="text-2xl font-bold">Go터뷰</h1>
        <p class="text-indigo-100 text-sm mt-1">AI 면접 연습 파트너</p>
    </div>
</header>


    <!-- Navigation -->
    <nav class="flex gap-2 mx-4 mt-4 items-center">
        <button id="nav-home" class="nav-btn active px-4 py-2 rounded-lg text-sm font-medium transition-colors">홈</button>
        <button id="nav-records" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors">기록/통계</button>
        <span id="backend-badge" class="backend-badge backend-badge-bedrock" title="현재 사용 중인 LLM 백엔드">📡 Bedrock</span>
    </nav>

    <!-- BYOK Panel (사이드바 대용 collapsible) -->
    <section id="byok-section" class="byok-section mx-4 mt-3">
        <details>
            <summary>🔑 API 키 설정 (선택)</summary>
            <p class="byok-hint">키 없이도 무료로 사용할 수 있어요. 본인 OpenRouter 키 사용 시 GPT/Claude/Gemini 등 모델을 자유롭게 선택할 수 있습니다.</p>
            <label for="byok-key" class="byok-label">OpenRouter API 키</label>
            <input type="password" id="byok-key" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
            <label for="byok-model" class="byok-label">모델 선택</label>
            <select id="byok-model"></select>
            <div class="byok-actions">
                <button id="byok-validate" type="button">키 검증</button>
                <button id="byok-clear" type="button" class="byok-secondary">지우기</button>
            </div>
            <label class="byok-remember">
                <input type="checkbox" id="byok-remember">
                이 브라우저에 키 저장 (localStorage)
            </label>
            <div id="byok-status" class="byok-status" role="status" aria-live="polite"></div>
            <p class="byok-fineprint">
                ⚠️ 키는 서버를 거치지만 저장되지 않습니다. 키 발급은
                <a href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer">openrouter.ai/keys</a> 에서.
            </p>
        </details>
    </section>

    <!-- Main View Container -->
    <main id="app" class="mx-4 mt-4 pb-8"></main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
