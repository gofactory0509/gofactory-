<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 면접관과 함께하는 실전 면접 연습 서비스">
    <title>Go면접 면접 연습</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-to-b from-gray-50 to-white min-h-screen">
    <!-- Header Banner -->
    <header class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6 rounded-xl mx-4 mt-4 shadow-lg">
        <h1 class="text-2xl font-bold">Go면접 면접 연습</h1>
        <p class="text-indigo-100 text-sm mt-1">AI 면접관과 함께하는 실전 면접 연습</p>
    </header>

    <!-- Navigation -->
    <nav class="flex gap-2 mx-4 mt-4">
        <button id="nav-home" class="nav-btn active px-4 py-2 rounded-lg text-sm font-medium transition-colors">홈</button>
        <button id="nav-records" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors">기록/통계</button>
    </nav>

    <!-- Main View Container -->
    <main id="app" class="mx-4 mt-4 pb-8"></main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
